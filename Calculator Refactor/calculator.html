<!DOCTYPE html>
<!-- ============================================================
     calculator.html — The Calculator Refactor page

     The page looks IDENTICAL to the original Calculator lesson —
     that's the point. All the changes are in calculator.js, where
     the maths has been pulled out into its own function that
     RETURNS its answer instead of writing it to the page.
     ============================================================ -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator (Refactored)</title>
    <style>
        /* The shared class theme: soft blue page, dark-blue headings. */
        body {
            font-family: Arial, sans-serif;
            background-color: #c8d4eb;
            max-width: 700px;
            margin: 0 auto;
            padding: 1rem;
            color: #0d0d35;
        }

        h1 { color: #0c3388; }

        input, select {
            font-size: 1rem;
            padding: 0.3rem;
            margin: 0.3rem 0;
        }

        button {
            font-size: 1rem;
            padding: 0.6rem 1rem;
            border: none;
            border-radius: 1rem;
            background-color: #0c3388;
            color: white;
            cursor: pointer;
            margin: 0.3rem 0;
        }

        button:hover { background-color: #034ef0; }

        #result {
            font-size: 1.3rem;
            font-weight: bold;
            color: #2927ac;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <h1>Calculator (Refactored)</h1>
    <p>Same calculator as before on the outside — but open calculator.js to see what changed on the inside.</p>

    <input id="first" placeholder="Enter first number">

    <select id="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>

    <input id="second" placeholder="Enter second number">

    <button id="calculate">=</button>

    <p id="result"></p>

    <!-- Load the behaviour last, after the elements above exist. -->
    <script src="calculator.js"></script>
</body>
</html>
