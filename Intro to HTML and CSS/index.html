<!DOCTYPE html>
<!-- ============================================================
     index.html — Intro to HTML & CSS: an "All About Me" page

     HTML is the stuff on the page: words, lists, and pictures.
     CSS is the colours and fonts that make it look nice.

     Change the words below to be about YOU, then open this file
     in a browser to see your very own web page!
     ============================================================ -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All About Me</title>
    <link rel="stylesheet" href="index.css"> <!-- connects the colours -->
</head>
<body>

    <!-- <h1> is the big title at the top of the page. -->
    <h1>All About Me</h1>

    <!-- <p> is a paragraph. It's just normal text. -->
    <p>Hi! My name is Alex. I am 9 years old and I made this web page myself.</p>

    <!-- <h2> is a smaller heading for a new part of the page. -->
    <h2>Things I Like</h2>

    <!-- <ul> is a bullet list. Each <li> is one thing in the list. -->
    <ul>
        <li>Pizza 🍕</li>
        <li>Soccer ⚽</li>
        <li>Drawing 🎨</li>
        <li>My dog 🐶</li>
    </ul>

    <!-- <img> shows a picture. "src" is the picture file. -->
    <h2>A Picture I Like</h2>
    <img src="picture.svg" alt="A sunny day with green hills">

</body>
</html>
